name: aahar_ai
description: A privacy-first, AI-powered nutrition tracker.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  flutter_dotenv: ^5.1.0
  intl: ^0.19.0
  path_provider: ^2.1.2
  supabase_flutter: ^2.3.0
  shared_preferences: ^2.2.2
  provider: ^6.1.1 
  camera: ^0.10.5
  http: ^1.2.0
  # --- NAVIGATION ---
  go_router: ^14.0.0
  url_launcher: ^6.2.0
  # --- STABLE ISAR V3 ---
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  image_picker: ^1.2.1
  google_generative_ai: ^0.4.6
  pdf: ^3.10.4
  printing: ^5.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9

  # --- STABLE GENERATOR V3 ---
  isar_generator: ^3.1.0+1

  # --- ICON GENERATOR ---
  flutter_launcher_icons: ^0.13.1

# --- ICON CONFIGURATION ---
flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF" 
  adaptive_icon_foreground: "assets/icon.png"

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/icon.png